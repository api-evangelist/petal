aid: petal
name: Petal
description: 'Petal is a New York-based consumer fintech that issues Visa credit cards
  aimed at people with limited or no credit history, underwriting applicants from their
  bank-account cash flow (its proprietary CashScore metric) rather than a traditional
  credit score alone. Its Petal 1, Petal 1 Rise and Petal 2 cards are issued by WebBank,
  and the business is now part of the Tilt family of consumer finance brands (Tilt Card,
  Inc., NMLS #2295169). Petal reaches customers through iOS and Android apps plus a web
  dashboard and help center. It is a direct-to-consumer card issuer: as of this profile
  it operates no developer program, publishes no API documentation, and exposes no
  machine-readable API contract on any of its public hosts.'
